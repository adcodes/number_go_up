<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Number Go Up</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <section class="counter" id="counter-section">
    <div class="label">Computation</div>
    <div id="computation" class="big">0</div>
    <div id="rate" class="small">+0 per second</div>
  </section>

  <section class="hero">
    <button id="create" class="create">
      <span class="b-title" id="create-title">Boot</span>
      <span class="b-detail" id="create-detail"></span>
    </button>
  </section>

  <section id="sim-section">
    <div class="section-head" id="sim-head">
      <h2>Simulations</h2>
      <span id="sim-count" class="count"></span>
    </div>
    <ul id="feed" class="feed"></ul>
  </section>

  <section id="upgrade-section">
    <button id="buy-upgrade" class="buy">
      <span class="b-title">Upgrade</span>
      <span class="b-detail" id="upgrade-detail"></span>
    </button>
  </section>

  <footer>
    <button id="reset" class="link">Delete save and start again</button>
  </footer>
</main>
<script src="feed.js"></script>
<script src="game.js"></script>
</body>
</html>
